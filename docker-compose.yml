services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fuse
      POSTGRES_PASSWORD: fuse
      POSTGRES_DB: fuse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuse -d fuse"]
      interval: 2s
      timeout: 5s
      retries: 30

  fuse:
    build: .
    environment:
      FUSE_DATABASE_URL: postgres://fuse:fuse@postgres:5432/fuse?sslmode=disable
      FUSE_UPSTREAM_API_KEY: ${FUSE_UPSTREAM_API_KEY:-}
      FUSE_SLACK_WEBHOOK_URL: ${FUSE_SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
